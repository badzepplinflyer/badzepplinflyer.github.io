<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex's Apps</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f2328;--card:#2a3037;--line:#3b434d;--text:#e9ecef;--muted:#9aa4af;--accent:#ffb000;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:56px 20px;display:flex;flex-direction:column;gap:20px}
h1{font-size:26px;margin:0;display:flex;align-items:center;gap:10px}
h1 i{display:inline-block;width:10px;height:24px;background:var(--accent);border-radius:2px}
a.card{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;color:var(--text);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
a.card b{font-weight:600}
a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1><i></i>Alex's Apps</h1>
  <a class="card" href="/pdf-editor/"><b>PDF Editor</b><span>Edit, sign and mark up PDFs, synced through Google Drive.</span></a>
</main>
</body>
</html>
